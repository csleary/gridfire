apiVersion: apps/v1
kind: Deployment
metadata:
  name: events
  namespace: gridfire-prod
  labels:
    app: events
spec:
  replicas: 2
  selector:
    matchLabels:
      app: events
  template:
    metadata:
      labels:
        app: events
    spec:
      containers:
        - name: events
          image: csleary/gridfire-web3-events:44562c8a65978997f047d68f67944aeef0207429
          imagePullPolicy: Always
          resources:
            requests:
              memory: 500Mi
              cpu: 25m
            limits:
              memory: 1Gi
              cpu: 500m
          env:
            - name: HEALTH_PROBE_PORT
              value: "9090"
          envFrom:
            - configMapRef:
                name: amqp-config
            - configMapRef:
                name: contracts-config
            - configMapRef:
                name: events-config
            - secretRef:
                name: api-secrets
            - secretRef:
                name: mongodb-uri
            - secretRef:
                name: rabbitmq-user
          ports:
            - containerPort: 9090
          startupProbe:
            tcpSocket:
              port: 9090
          readinessProbe:
            tcpSocket:
              port: 9090
          livenessProbe:
            tcpSocket:
              port: 9090
      imagePullSecrets:
        - name: regcred
      tolerations:
        - key: "key1"
          operator: "Equal"
          value: "workers"
          effect: "NoSchedule"
