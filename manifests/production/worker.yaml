apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: gridfire-prod
  labels:
    app: worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: csleary/gridfire-worker
          imagePullPolicy: Always
          resources:
            requests:
              memory: 381M
              cpu: 63m
            limits:
              memory: 381M
              cpu: 63m
          envFrom:
            - configMapRef:
                name: amqp-config
            - configMapRef:
                name: ipfs-config
            - configMapRef:
                name: worker-config
            - secretRef:
                name: aws-secrets
            - secretRef:
                name: mongodb-uri
            - secretRef:
                name: rabbitmq-user
          ports:
            - containerPort: 9090
          startupProbe:
            tcpSocket:
              port: 9090
          readinessProbe:
            tcpSocket:
              port: 9090
          livenessProbe:
            tcpSocket:
              port: 9090
      imagePullSecrets:
        - name: regcred
      tolerations:
        - key: "key1"
          operator: "Equal"
          value: "workers"
          effect: "NoSchedule"
