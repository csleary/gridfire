grafana:
  persistence:
    enabled: true
    type: sts
    storageClassName: "hcloud-volumes"
    accessModes:
      - ReadWriteOnce
    size: 20Gi
    finalizers:
      - kubernetes.io/pvc-protection

# For alloy to write rabbitmq metrics
prometheus:
  prometheusSpec:
    enableRemoteWriteReceiver: true
